<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPL Auction</title>
<link rel="icon" href="data:,">
<style>
:root {
--bg: #f4f5f7;
--card: #fff;
--soft: #f0f2f5;
--text: #16191f;
--muted: #5d6573;
--line: #dde1e7;
--green: #0b6e4f;
--red: #b42318;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
h2 { font-size: 1.1rem; margin: 0 0 12px; }
button { font: inherit; cursor: pointer; padding: 10px 14px; min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
button:disabled { opacity: .5; cursor: not-allowed; }
.green { background: var(--green); border-color: var(--green); color: #fff; font-weight: 600; }
.red { color: var(--red); border-color: var(--red); font-weight: 600; }
.small { min-height: 34px; padding: 5px 12px; font-size: .9rem; }
.muted { color: var(--muted); }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 16px; background: var(--card); border-bottom: 1px solid var(--line); }
header b { font-size: 1.05rem; }
#switch { border: 0; background: none; color: var(--green); text-decoration: underline; min-height: 0; padding: 4px; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
#picker { max-width: 520px; margin: 24px auto; display: grid; gap: 10px; }
#picker button { text-align: left; padding: 14px 16px; }
#board { display: grid; gap: 16px; }
@media (min-width: 860px) {
#board { grid-template-columns: 3fr 2fr; align-items: start; }
#rosters { grid-column: 1 / -1; }
}
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.lot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; background: var(--soft); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
.lot .name { font-size: 1.35rem; font-weight: 700; }
.lot .high { text-align: right; }
.lot .high b { display: block; font-size: 1.6rem; }
ol, ul { list-style: none; margin: 0; padding: 0; }
#bids li, #players li { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
#bids li:first-child { font-weight: 700; }
#bids li:last-child, #players li:last-child { border-bottom: 0; }
#bids { margin-bottom: 14px; }
.live { font-size: .7rem; font-weight: 700; color: #fff; background: var(--green); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
#bid-form label { display: block; font-weight: 600; margin-bottom: 6px; }
#bid-form div { display: flex; gap: 8px; }
#amount { flex: 1; min-width: 0; font: inherit; font-size: 1.1rem; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
#hint { font-size: .9rem; margin: 8px 0 0; }
#controls { display: flex; flex-wrap: wrap; gap: 8px; }
#controls button { flex: 1 1 180px; }
#msg { margin: 12px 0 0; padding: 10px 12px; border-radius: 8px; }
#msg.error { background: #fdecea; color: var(--red); }
#msg.ok { background: #e6f4ee; color: var(--green); }
#teams { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.team { border-top: 4px solid var(--green); }
.team.mine { outline: 2px solid var(--green); }
.team h3 { margin: 0 0 4px; font-size: 1rem; }
.team li { display: flex; justify-content: space-between; padding: 5px 0; border-top: 1px dashed var(--line); font-size: .9rem; }
.bar { height: 6px; background: var(--soft); border-radius: 6px; margin: 8px 0; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--green); }
</style>
</head>
<body>
<header>
<div><b>IIT Goa Premier League</b> <span class="muted">· Player auction</span></div>
<div id="me" hidden><span id="me-name"></span> <button id="switch">Switch role</button></div>
</header>
<main>
<div id="picker" hidden>
<h2>Who are you?</h2>
<button data-role="auctioneer"><b>Auctioneer</b><br><span class="muted">Start auctions, accept or reject bids</span></button>
<div id="picker-teams" style="display: grid; gap: 10px"></div>
<button data-role="viewer"><b>Viewer</b><br><span class="muted">Just watch</span></button>
</div>
<div id="board" hidden>
<section class="card">
<h2>On the block</h2>
<div id="lot"></div>
<form id="bid-form" hidden>
<label for="amount">Your bid (₹ lakh)</label>
<div>
<input id="amount" type="number" inputmode="numeric" min="1" step="1">
<button class="green" id="bid-btn">Place bid</button>
</div>
<p id="hint" class="muted"></p>
</form>
<div id="controls" hidden>
<button class="green" id="accept">Accept highest bid</button>
<button class="red" id="reject">Reject round</button>
</div>
<p id="msg" hidden></p>
</section>
<section class="card">
<h2>Available players (<span id="count"></span>)</h2>
<ul id="players"></ul>
</section>
<section id="rosters">
<h2>Team rosters</h2>
<div id="teams"></div>
</section>
</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const rs = (n) => `₹${n} L`;
const SKILL = { batting: 'Batter', bowling: 'Bowler', both: 'All-rounder' };
let user = null;
let data = null;
let lastPlayer = null;
const params = new URLSearchParams(location.search);
if (params.get('role')) {
user = { role: params.get('role'), team: Number(params.get('team')) || null };
} else {
try { user = JSON.parse(localStorage.getItem('gpl-user')); } catch (e) {}
}
function setUser(u) {
user = u;
try { localStorage.setItem('gpl-user', JSON.stringify(u)); } catch (e) {}
history.replaceState(null, '', location.pathname);
render();
}
async function api(url, body) {
const headers = { 'Content-Type': 'application/json' };
if (user) headers['X-Role'] = user.role;
if (user && user.team) headers['X-Team'] = user.team;
const res = await fetch(url, body === undefined ? { headers } : { method: 'POST', headers, body: JSON.stringify(body) });
const json = await res.json().catch(() => ({}));
if (!res.ok) throw new Error(json.error || 'Request failed');
return json;
}
async function load() {
try {
data = await api('/api/state');
render();
} catch (e) {
show('Cannot reach the server', true);
}
}
let msgTimer;
function show(text, isError) {
$('msg').textContent = text;
$('msg').className = isError ? 'error' : 'ok';
$('msg').hidden = false;
clearTimeout(msgTimer);
msgTimer = setTimeout(() => ($('msg').hidden = true), 5000);
}
async function act(url, body, success) {
try {
const result = await api(url, body);
show(success(result));
} catch (e) {
show(e.message, true);
}
load();
}
function html(id, value) {
if ($(id).dataset.last !== value) {
$(id).innerHTML = value;
$(id).dataset.last = value;
}
}
function esc(s) {
return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function render() {
if (!data) return;
const myTeam = user && user.role === 'manager' ? data.teams.find((t) => t.id === user.team) : null;
if (user && user.role === 'manager' && !myTeam) user = null;
$('picker').hidden = !!user;
$('board').hidden = !user;
$('me').hidden = !user;
if (!user) {
html('picker-teams', data.teams.map((t) =>
`<button data-role="manager" data-team="${t.id}"><b>${esc(t.name)}</b><br>
<span class="muted">Team manager · ${rs(t.remaining_budget)} left</span></button>`).join(''));
return;
}
$('me-name').textContent = myTeam ? `Manager · ${myTeam.name}` : user.role === 'auctioneer' ? 'Auctioneer' : 'Viewer';
const live = data.auction;
if (!live) {
html('lot', `<p class="muted">No player is up for auction right now.
${user.role === 'auctioneer' ? 'Pick one from the list to start.' : 'Waiting for the auctioneer.'}</p>`);
} else {
const p = live.player;
const h = live.highest;
html('lot', `
<div class="lot">
<div><div class="name">${esc(p.name)}</div><div class="muted">${SKILL[p.skill]} · Base ${rs(p.base_price)}</div></div>
<div class="high"><span class="muted">Highest bid</span><b>${h ? rs(h.amount) : '—'}</b>${h ? esc(h.team_name) : 'No bids yet'}</div>
</div>
<h3 class="muted" style="font-size: .95rem">Bids (${live.bids.length})</h3>
<ol id="bids">${live.bids.map((b) => `
<li><span>${esc(b.team_name)}</span><span>${rs(b.amount)} <small class="muted">${new Date(b.time).toLocaleTimeString()}</small></span></li>`).join('')
|| '<li class="muted">No bids yet</li>'}
</ol>`);
}
const livePlayer = live ? live.player.id : null;
if (livePlayer !== lastPlayer) $('amount').value = '';
lastPlayer = livePlayer;
$('bid-form').hidden = !(myTeam && live);
if (myTeam && live) {
const min = Math.max(live.player.base_price, live.highest ? live.highest.amount : 0) + 1;
const leading = live.highest && live.highest.team_id === myTeam.id;
$('amount').placeholder = `${min} or more`;
$('bid-btn').disabled = leading;
$('hint').textContent = leading
? 'You have the highest bid. Wait for another team.'
: `Minimum ${rs(min)} · You have ${rs(myTeam.remaining_budget)} left`;
}
$('controls').hidden = !(user.role === 'auctioneer' && live);
if (live) {
$('accept').disabled = !live.highest;
$('accept').textContent = live.highest ? `Accept ${rs(live.highest.amount)} from ${live.highest.team_name}` : 'Accept highest bid';
}
const left = data.players.filter((p) => p.status !== 'sold');
$('count').textContent = left.length;
const canStart = user.role === 'auctioneer' && !live;
html('players', left.map((p) => `
<li>
<div>
<b>${esc(p.name)}</b>${p.status === 'in_auction' ? '<span class="live">LIVE</span>' : ''}
<div class="muted" style="font-size: .85rem">${SKILL[p.skill]} · Base ${rs(p.base_price)}</div>
</div>
${canStart ? `<button class="small" data-start="${p.id}">Start auction</button>` : ''}
</li>`).join('') || '<li class="muted">All players are sold</li>');
html('teams', data.teams.map((t) => `
<div class="card team ${myTeam && myTeam.id === t.id ? 'mine' : ''}">
<h3>${esc(t.name)}</h3>
<div><b>${rs(t.remaining_budget)}</b> <span class="muted">left of ${rs(t.total_budget)} · ${t.players.length} player${t.players.length === 1 ? '' : 's'}</span></div>
<div class="bar"><span style="width: ${(t.remaining_budget / t.total_budget) * 100}%"></span></div>
<ul>${t.players.map((p) => `<li><span>${esc(p.name)}</span><b>${rs(p.sold_price)}</b></li>`).join('')
|| '<li class="muted">No players yet</li>'}</ul>
</div>`).join(''));
}
$('picker').onclick = (e) => {
const btn = e.target.closest('[data-role]');
if (btn) setUser({ role: btn.dataset.role, team: Number(btn.dataset.team) || null });
};
$('switch').onclick = () => setUser(null);
$('players').onclick = (e) => {
const btn = e.target.closest('[data-start]');
if (btn) act('/api/auction/start', { playerId: Number(btn.dataset.start) }, (r) => `${r.player.name} is up for auction`);
};
$('bid-form').onsubmit = (e) => {
e.preventDefault();
const amount = Number($('amount').value);
if (!$('amount').value) return show('Enter an amount', true);
act('/api/auction/bid', { amount }, () => {
$('amount').value = '';
return `Bid of ${rs(amount)} placed`;
});
};
$('accept').onclick = () => act('/api/auction/accept', {}, (p) => `${p.name} sold for ${rs(p.sold_price)}`);
$('reject').onclick = () => act('/api/auction/reject', {}, (p) => `Round rejected, ${p.name} is back in the pool`);
load();
setInterval(load, 2000);
</script>
</body>
</html>
